name: Backend checks

on:
  pull_request:
    paths: ['apps/api/**', 'apps/web/scripts/generate-api.*', 'apps/web/src/services/contracts/**', '.github/workflows/backend.yml']
  push:
    branches: [main]
    paths: ['apps/api/**', 'apps/web/scripts/generate-api.*', 'apps/web/src/services/contracts/**', '.github/workflows/backend.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify generated browser contract without installing packages
        run: |
          node --version
          node apps/web/scripts/generate-api.mjs --check
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: thesis_test
          POSTGRES_PASSWORD: ephemeral-ci-only
          POSTGRES_DB: thesis_pilot_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TP_TEST_DATABASE_URL: postgresql+psycopg://thesis_test:ephemeral-ci-only@127.0.0.1:5432/thesis_pilot_test
      TP_TEST_REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.17'
          python-version: '3.13'
          enable-cache: true
      - name: Require reviewed dependency lock
        run: test -f uv.lock
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Check backend and real services
        run: uv run --locked python scripts/check.py --integration
