location = /overview {
    alias /www/sites/thesis.springcc.cn/index/overview/index.html;
    default_type text/html;
    charset utf-8;
    add_header Cache-Control "no-cache";
}
location ^~ /overview/ {
    root /www/sites/thesis.springcc.cn/index;
    index index.html;
    autoindex off;
    charset utf-8;
    add_header Cache-Control "no-store";
}
